name: Incidente

on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'Ação'
        type: choice
        options: [abrir, atualizar, resolver]
        required: true
      id:
        description: 'Id do incidente (vazio ao abrir)'
        type: string
        required: false
        default: ''
      linhas:
        description: 'Linhas, separadas por vírgula (app, login, banco); só ao abrir'
        type: string
        required: false
        default: ''
      tipo:
        description: 'Tipo (só ao abrir)'
        type: choice
        options: [fora, degradado]
        required: true
      estado:
        description: 'Estado (ao resolver, é ignorado)'
        type: choice
        options: [investigando, identificado, monitorando, resolvido]
        required: true
      titulo_pt:
        description: 'Título em português (até 120 caracteres)'
        type: string
        required: false
        default: ''
      titulo_es:
        description: 'Título em espanhol (até 120 caracteres)'
        type: string
        required: false
        default: ''
      texto_pt:
        description: 'Texto em português (até 1000 caracteres)'
        type: string
        required: false
        default: ''
      texto_es:
        description: 'Texto em espanhol (até 1000 caracteres)'
        type: string
        required: false
        default: ''

permissions: {}

# D13: grupo próprio; a checagem tem o seu e nenhum espera nem cancela o outro.
concurrency:
  group: incidente
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Confere as entradas antes de qualquer git; depois, em cada tentativa: busca o dados, aplica, commit e
      # push (D13). O token só chega ao push.
      - name: Conferir e gravar o incidente
        env:
          ACAO: ${{ inputs.acao }}
          ID: ${{ inputs.id }}
          LINHAS: ${{ inputs.linhas }}
          TIPO: ${{ inputs.tipo }}
          ESTADO: ${{ inputs.estado }}
          TITULO_PT: ${{ inputs.titulo_pt }}
          TITULO_ES: ${{ inputs.titulo_es }}
          TEXTO_PT: ${{ inputs.texto_pt }}
          TEXTO_ES: ${{ inputs.texto_es }}
          GH_TOKEN: ${{ github.token }}
          REMOTO: https://github.com/${{ github.repository }}
        run: >-
          node scripts/incidente.mjs --config config/alvos.json
          --arvore "$RUNNER_TEMP/dados-ramo" --remoto "$REMOTO"

  publicar:
    needs: gravar
    if: vars.FONTE_DOS_DADOS == 'dados'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
