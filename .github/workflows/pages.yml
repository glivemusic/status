name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'exemplo/**'
      - 'config/**'
      - 'scripts/montar-site.mjs'
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Vazia = exemplo.
      FONTE_DOS_DADOS: ${{ vars.FONTE_DOS_DADOS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Buscar o ramo dados
        if: env.FONTE_DOS_DADOS == 'dados'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dados
          path: dados-ramo
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Montar o site
        run: |
          case "$FONTE_DOS_DADOS" in
            ''|exemplo) fonte=exemplo ;;
            dados) fonte=dados-ramo ;;
            *) echo "FONTE_DOS_DADOS inválida: use exemplo ou dados." >&2; exit 1 ;;
          esac
          node scripts/montar-site.mjs --fonte "$fonte" --saida _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
